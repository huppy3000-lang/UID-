name: Build UID Module
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK and Build
        run: |
          mkdir -p "$HOME/android-sdk/ndk"
          curl -sL https://dl.google.com/android/repository/android-ndk-r27d-linux.zip -o ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r27d "$HOME/android-sdk/ndk/27.3.13750724"
          rm ndk.zip
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_NDK_HOME="$HOME/android-sdk/ndk/27.3.13750724"
          export ANDROID_NDK_ROOT="$HOME/android-sdk/ndk/27.3.13750724"
          python3 tools/uid-seccomp-module/build.py --module-only
      - name: Publish Release Zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: "**/*.zip"
          
